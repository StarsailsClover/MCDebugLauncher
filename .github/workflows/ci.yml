name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Trim debuginfo: keeps PDB/DWARF small (Windows LNK PDB limits) and
  # speeds up linking on hosted runners. Test assertions are unaffected.
  RUSTFLAGS: -C debuginfo=0

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
        # NOTE: x86_64-apple-darwin (macos-13) was removed after its job sat
        # queued 30+ minutes: the macos-13 Intel image is deprecated by GitHub
        # and Intel hosted runners are effectively unavailable. aarch64 covers
        # the Darwin code paths; revisit if Intel-mac builds are ever needed
        # (e.g. macos-15-intel large runner or self-hosted).
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Check (${{ matrix.target }})
        run: cargo check --bin mdl --target ${{ matrix.target }} --locked

      - name: Test (${{ matrix.target }})
        run: cargo test --bin mdl --target ${{ matrix.target }}
