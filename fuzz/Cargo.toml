[package]
name = "mdl-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
anyhow = "1.0"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.mcdebug-launcher]
path = ".."

# Keep this crate out of the parent workspace: fuzz builds use nightly
# sanitizer runtimes and must not interfere with release builds.
[workspace]
members = ["."]

[[bin]]
name = "parse_log_content"
path = "fuzz_targets/parse_log_content.rs"
test = false
doc = false
bench = false

[[bin]]
name = "props_editor"
path = "fuzz_targets/props_editor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonio_bom_parse"
path = "fuzz_targets/jsonio_bom_parse.rs"
test = false
doc = false
bench = false
