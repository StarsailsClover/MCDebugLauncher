[package]
name = "mcdebug-launcher"
version = "26.1.0-alpha.2"
edition = "2021"
authors = ["Sails <sails@example.com>"]
license = "Apache-2.0"
description = "A command-line Minecraft launcher for developers, testers, and AI agents"
repository = "https://github.com/StarsailsClover/MCDebugLauncher"
keywords = ["minecraft", "launcher", "cli", "mod", "testing"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mdl"
path = "src/main.rs"

[dependencies]
# CLI framework
clap = { version = "4.5", features = ["derive", "cargo", "env"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# XML parsing
serde-xml-rs = "0.6"

# Configuration
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File operations
sha1 = "0.10"
sha2 = "0.10"
zip = "2.2"
walkdir = "2.5"
# Java runtime archive extraction (tar.gz on Linux/macOS)
tar = "0.4"
flate2 = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
regex = "1.10"
sysinfo = "0.30"
indicatif = "0.17"
console = "0.15"

# HTTP server
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures-util = "0.3"

# Image encoding (screenshot PNG output)
image = { version = "0.25", default-features = false, features = ["png"] }

# Base64 encoding for screenshot API responses
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# High-performance window capture via Windows.Graphics.Capture
windows-capture = "2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.13"
mockito = "1.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
